name: Brand sync
on:
  workflow_dispatch:
  push:
    paths: ['tools/brand.py', '.github/workflows/brand.yml']
permissions:
  contents: write
jobs:
  brand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pillow
      - run: python tools/brand.py
      - name: Commit logo, colours and icons
        run: |
          git config user.name "brand-bot"
          git config user.email "brand-bot@users.noreply.github.com"
          git add web/brand web/icons
          git diff --cached --quiet || git commit -m "Brand sync: logo, colours and icons from colabpoint.com"
          git push
